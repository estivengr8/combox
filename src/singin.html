<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Combox | Sign In</title>

    <link rel="icon" type="image/png" href="icons/my logo 0.1.png">

    <style>

        body {
            background-color: #7D7D7D;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background-color: #eeeeee;
            border: 2px solid #555555;
            border-radius: 5px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        input {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 5px;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 9px;
            margin-top: 15px;
            cursor: pointer;
        }

        .or {
            margin: 18px 0;
        }

        .social {
            width: 100%;
            padding: 9px;
            margin-top: 8px;
            background-color: white;
            border: 1px solid #888888;
        }

        .register {
            display: block;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="login">

        <h2>Login</h2>

        <label>Email</label>
        <input type="email">

        <label>Password</label>
        <input type="password">

        <a href="#" class="forgot">I forgot my password</a>

        <button>Login</button>

        <div class="or">
            ────────── &nbsp; or &nbsp; ──────────
        </div>

        <button class="social">
            🟢 &nbsp; Login with Google
        </button>

        <button class="social">
            🔵 &nbsp; Login with Facebook
        </button>

        <a href="signup.html" class="register">
            Register
        </a>

    </div>

</body>
</html>
